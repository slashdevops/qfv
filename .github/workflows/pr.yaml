name: Pull Request

on:
  pull_request:
    branches:
      - main

env:
  MAKE_STOP_ON_ERRORS: true

# The job checks the code out, builds and tests it, and writes its report to
# the step summary. It needs to read the repository and nothing else; without
# this block the token gets whatever the repository's default grants.
permissions:
  contents: read

# Every step runs with "shell: bash", which GitHub runs as
# "bash --noprofile --norc -eo pipefail {0}". The default for a step that
# names no shell is "bash -e {0}", without pipefail: "go test ... | tee"
# and "go-test-coverage ... | sed ... | tee" took tee's status, so a failing
# test or a coverage below its threshold passed the job.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod

      # What the pull request's author writes (its title, its branch, its
      # login) reaches the script as environment variables, never spliced
      # into it: an expression in a script is text in the script.
      - name: Summary Information
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "# Pull Request Summary" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Pull Request:** ${PR_TITLE}" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${PR_AUTHOR}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${PR_HEAD}" >> $GITHUB_STEP_SUMMARY
          echo "**Base:** ${PR_BASE}" >> $GITHUB_STEP_SUMMARY
          echo "**Commits:** ${{ github.event.pull_request.commits }}" >> $GITHUB_STEP_SUMMARY
          echo "**Changed Files:** ${{ github.event.pull_request.changed_files }}" >> $GITHUB_STEP_SUMMARY
          echo "**Additions:** ${{ github.event.pull_request.additions }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deletions:** ${{ github.event.pull_request.deletions }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Tools and versions
        run: |
          echo "## Tools and versions" >> $GITHUB_STEP_SUMMARY

          ubuntu_version=$(lsb_release -a 2>&1 | grep "Description" | awk '{print $2, $3, $4}')
          echo "Ubuntu version: $ubuntu_version"
          echo "**Ubuntu Version:** $ubuntu_version" >> $GITHUB_STEP_SUMMARY

          bash_version=$(bash --version | head -n 1 | awk '{print $4}')
          echo "Bash version: $bash_version"
          echo "**Bash Version:** $bash_version" >> $GITHUB_STEP_SUMMARY

          git_version=$(git --version | awk '{print $3}')
          echo "Git version: $git_version"
          echo "**Git Version:** $git_version" >> $GITHUB_STEP_SUMMARY

          go_version=$(go version | awk '{print $3}')
          echo "Go version: $go_version"
          echo "**Go Version:** $go_version" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Lines of code
        run: |
          echo "## Lines of code" >> $GITHUB_STEP_SUMMARY

          go install github.com/boyter/scc/v3@latest
          scc --format html-table . | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: lint
        run: |
          echo "## Lint" >> $GITHUB_STEP_SUMMARY

          # Pinned, as the coverage tool is: this module builds with the Go
          # of its go.mod (1.26, GOTOOLCHAIN=local), and a golangci-lint
          # whose go directive is newer does not install. v2.15.0 declares
          # go 1.26.0. Raise it with the go directive. The linters it runs
          # are .golangci.yaml's.
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

          golangci-lint run ./... | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: test
        run: |
          echo "### Test report" >> $GITHUB_STEP_SUMMARY

          go test -race -coverprofile=coverage.txt -covermode=atomic -tags=unit ./... | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: test coverage
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY

          # Pinned: v2.20.0 requires Go 1.27 and this module builds with the
          # Go of its go.mod (1.26, GOTOOLCHAIN=local). "@latest" broke the job
          # the day that version was published. Raise it with the go directive.
          go install github.com/vladopajic/go-test-coverage/v2@v2.19.0

          # execute again to get the summary
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage report" >> $GITHUB_STEP_SUMMARY
          go-test-coverage --config=./.testcoverage.yml | sed 's/PASS/PASS  ✅/g' | sed 's/FAIL/FAIL  ❌/g' | tee -a $GITHUB_STEP_SUMMARY
